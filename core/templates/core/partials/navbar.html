<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200" 
        x-data="{ mobileMenuOpen: false, partnerDropdownOpen: false }">
    <div class="max-w-7xl mx-auto px-6">
        <div class="flex justify-between items-center h-20">

            <a href="{% url 'core:home' %}" class="flex items-center gap-3 group shrink-0">
                <span class="text-xl md:text-2xl font-black text-pink-700 tracking-tight group-hover:text-pink-800 transition-colors">
                    PFS Online Portal
                </span>
            </a>

            <nav class="hidden lg:flex items-center gap-5 xl:gap-7 font-semibold text-sm text-slate-600">
                <a href="{% url 'core:home' %}" class="hover:text-pink-700 transition-colors">Home</a>
                <a href="{% url 'core:about' %}" class="hover:text-pink-700 transition-colors">About</a>
                <a href="{% url 'core:journey' %}" class="hover:text-pink-700 transition-colors">FDA Journey</a>
                <a href="{% url 'core:pricing' %}" class="hover:text-pink-700 transition-colors">Pricing</a>
                
                <div class="relative" @click.away="partnerDropdownOpen = false">
                    <button @click="partnerDropdownOpen = !partnerDropdownOpen" 
                            class="flex items-center gap-1 hover:text-pink-700 transition-colors focus:outline-none">
                        <span>Join Us</span>
                        <svg class="w-4 h-4 transition-transform duration-200" :class="partnerDropdownOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <div x-show="partnerDropdownOpen"
                         x-transition:enter="transition ease-out duration-100"
                         x-transition:enter-start="opacity-0 transform scale-95"
                         x-transition:enter-end="opacity-100 transform scale-100"
                         x-transition:leave="transition ease-in duration-75"
                         x-transition:leave-start="opacity-100 transform scale-100"
                         x-transition:leave-end="opacity-0 transform scale-95"
                         class="absolute left-0 mt-3 w-52 bg-white border border-slate-200 rounded-xl shadow-xl py-2 z-50 hidden"
                         :class="{ 'hidden': !partnerDropdownOpen }">
                        <a href="{% url 'core:ambassadors' %}" class="block px-4 py-2.5 text-slate-700 hover:bg-slate-50 hover:text-pink-700 transition-colors">Become an Associate</a>
                        <a href="{% url 'core:consultants' %}" class="block px-4 py-2.5 text-slate-700 hover:bg-slate-50 hover:text-pink-700 transition-colors">Become a Consultant</a>
                    </div>
                </div>

                <a href="{% url 'core:contact' %}" class="hover:text-pink-700 transition-colors">Contact</a>
            </nav>

            <div class="hidden lg:flex items-center gap-5 text-sm">
                <a href="{% url 'accounts:login' %}"
                class="font-semibold text-slate-600 hover:text-slate-900 transition-colors duration-200 tracking-tight py-2.5">
                    Log in
                </a>
                
                <a href="{% url 'accounts:register' %}"
                class="inline-flex items-center justify-center font-bold text-white bg-slate-950 hover:bg-slate-800 active:scale-[0.98] px-5 py-2.5 rounded-xl transition-all duration-200 tracking-tight shadow-md shadow-slate-950/10 focus:outline-none focus:ring-2 focus:ring-pink-600 focus:ring-offset-2">
                    Get Started
                </a>
            </div>

            <button @click="mobileMenuOpen = !mobileMenuOpen"
                    class="lg:hidden p-2.5 rounded-xl text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors focus:outline-none"
                    aria-label="Toggle Menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-show="!mobileMenuOpen">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-show="mobileMenuOpen" x-cloak>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>

        </div>
    </div>

    <div x-show="mobileMenuOpen"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-4"
         class="lg:hidden fixed inset-x-0 top-20 bg-white border-b border-slate-200 shadow-2xl max-h-[calc(100vh-5rem)] overflow-y-auto hidden"
         :class="{ 'hidden': !mobileMenuOpen }">
        <div class="px-6 py-6 space-y-3 font-semibold text-slate-700">
            <a href="{% url 'core:home' %}" class="block py-2.5 border-b border-slate-50 hover:text-pink-700">Home</a>
            <a href="{% url 'core:about' %}" class="block py-2.5 border-b border-slate-50 hover:text-pink-700">About</a>
            <a href="{% url 'core:journey' %}" class="block py-2.5 border-b border-slate-50 hover:text-pink-700">FDA Journey</a>
            <a href="{% url 'core:pricing' %}" class="block py-2.5 border-b border-slate-50 hover:text-pink-700">Pricing</a>
            
            <div class="py-2 space-y-2 bg-slate-50/60 px-3 rounded-xl border border-slate-100">
                <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider pl-1">Partnerships</span>
                <a href="{% url 'core:ambassadors' %}" class="block py-1.5 pl-1 text-sm text-slate-600 hover:text-pink-700">Become an Associate</a>
                <a href="{% url 'core:consultants' %}" class="block py-1.5 pl-1 text-sm text-slate-600 hover:text-pink-700">Become a Consultant</a>
            </div>

            <a href="{% url 'core:contact' %}" class="block py-2.5 text-slate-700 hover:text-pink-700">Contact</a>
            
            <div class="flex flex-col gap-3 pt-6 border-t border-slate-100">
                <a href="{% url 'accounts:register' %}"
                class="block text-center w-full py-3.5 rounded-xl bg-pink-700 hover:bg-pink-800 active:scale-[0.99] text-white font-bold text-sm transition-all duration-200 tracking-tight shadow-md shadow-pink-700/10">
                    Get Started Instantly
                </a>
                
                <a href="{% url 'accounts:login' %}"
                class="block text-center w-full py-3.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold text-sm transition-all duration-200 tracking-tight border border-slate-200/80">
                    Log in to Account
                </a>
            </div>
        </div>
    </div>
</header>
